version: '3.8'

services:
  nightmare-console:
    build: .
    container_name: nightmare-code-console
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_API_URL=${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-3.5-turbo}
      - AI_MOCK_MODE=${AI_MOCK_MODE:-true}
    volumes:
      - workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  workspace:
